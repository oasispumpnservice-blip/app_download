<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오아시스펌프 앱 다운로드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: radial-gradient(circle at 50% -10%, #163a52, #061021 60%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 44px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: rise 0.5s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .icon-wrap {
    position: relative;
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
  }
  .ripple {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    border: 1.5px solid rgba(77,163,255,0.6);
    animation: ripple 2.4s ease-out infinite;
  }
  .ripple.delay { animation-delay: 0.8s; }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .icon {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4da3ff, #22c55e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.65);
    margin-bottom: 28px;
  }
  .close-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    font-weight: 600;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .close-btn:active { opacity: 0.8; transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="ripple"></div>
      <div class="ripple delay"></div>
      <div class="icon">💧</div>
    </div>
    <div class="logo">오아시스펌프</div>
    <div class="subtitle">해당 페이지로 이동 중입니다. 잠시만 기다려 주세요.<br>페이지가 닫히지 않으면 이동 확인 후 닫으셔도 됩니다.</div>
    <button class="close-btn" onclick="closeThisTab()">닫기</button>
  </div>

  <script>
    // ponytail: browsers block window.close() on tabs they didn't open via script,
    // so this can only ever be a best-effort attempt (some in-app browsers allow it,
    // most normal Chrome/Safari tabs will just ignore it) — no full workaround exists.
    function closeThisTab() {
      try { window.open("", "_self"); window.close(); } catch (e) {}
      try { window.close(); } catch (e) {}
    }

    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var appStore = "https://apps.apple.com/kr/app/%EC%98%A4%EC%95%84%EC%8B%9C%EC%8A%A4%ED%8E%8C%ED%94%84/id6793337409";
      var playStore = "https://play.google.com/store/apps/details?id=kr.co.oasispumpservice";
      var webLink = "https://oasispump.app";

      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);
      var target = isIOS ? appStore : isAndroid ? playStore : webLink;

      window.location.href = target;
      setTimeout(closeThisTab, 300);
    })();
  </script>
</body>
</html>
