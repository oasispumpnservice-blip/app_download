<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오아시스펌프 앱 다운로드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a5f);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 32px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #4da3ff;
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-apple { background: #fff; color: #000; }
  .btn-google { background: #4da3ff; color: #fff; }
  .hint {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">오아시스펌프</div>
    <div class="subtitle" id="subtitle">잠시만 기다려주세요, 스토어로 이동합니다</div>
    <div class="spinner" id="spinner"></div>
    <a class="btn btn-apple" href="https://apps.apple.com/kr/app/%EC%98%A4%EC%95%84%EC%8B%9C%EC%8A%A4%ED%8E%8C%ED%94%84/id6793337409">App Store에서 열기</a>
    <a class="btn btn-google" href="https://play.google.com/store/apps/details?id=kr.co.oasispumpservice">Google Play에서 열기</a>
    <div class="hint">자동으로 이동하지 않으면 위 버튼을 눌러주세요</div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var appStore = "https://apps.apple.com/kr/app/%EC%98%A4%EC%95%84%EC%8B%9C%EC%8A%A4%ED%8E%8C%ED%94%84/id6793337409";
      var playStore = "https://play.google.com/store/apps/details?id=kr.co.oasispumpservice";

      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);

      if (isIOS) {
        window.location.href = appStore;
      } else if (isAndroid) {
        window.location.href = playStore;
      } else {
        // PC 등: 자동 이동 없이 버튼만 노출
        document.getElementById("spinner").style.display = "none";
        document.getElementById("subtitle").textContent = "다운로드할 스토어를 선택해주세요";
      }
    })();
  </script>
</body>
</html>
